
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademicBox — Cadastro</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style/cadastro.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar-academicbox">
  <div class="d-flex align-items-center gap-2">
    <div class="brand-mark"></div>
    <span class="brand-name">AcademicBox</span>
  </div>
  <div class="d-flex align-items-center gap-1">
    <a href="#" class="nav-link-academic">
      <i class="bi bi-house"></i><span>Home</span>
    </a>
    <a href="#" class="nav-link-academic">
      <i class="bi bi-person"></i><span>Perfil</span>
    </a>
    <a href="#" class="btn-entrar-nav ms-1">
      <i class="bi bi-box-arrow-in-right"></i> Entrar
    </a>
  </div>
</nav>

<!-- Cadastro -->
<div class="page-wrapper">

  <h1 class="page-title">Cadastro</h1>

  <div class="register-card">

    <div class="field-group">
      <input id="nome" type="text" class="form-control-academic" placeholder="Seu nome completo">
    </div>

    <div class="field-group">
      <input id="email" type="email" class="form-control-academic" placeholder="seu@email.com">
    </div>

    <div class="field-group">
      <input id="senha" type="password" class="form-control-academic" placeholder="••••••••">

    </div>

    <div class="field-group">
      <input id="confirmarSenha" type="password" class="form-control-academic" placeholder="••••••••">
    </div>

    
    <button id="btnCadastrar" class="btn-cadastrar">Cadastrar</button>

  </div>

  <p class="login-hint">Já tem uma conta? <a href="#">Faça login</a></p>

</div>
<script src="../js/cadastro.js"></script>
</body>
</html>
