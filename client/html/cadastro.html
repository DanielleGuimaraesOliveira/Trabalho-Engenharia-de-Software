
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademicBox — Cadastro</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../style/cadastro.css">

</head>
<body>

<!-- Navbar -->
<div id="navbar"></div>

<!-- Cadastro -->
<div class="page-wrapper">

  <h1 class="page-title">Cadastro</h1>

  <div class="register-card">

    <div class="field-group">
      <input id="nome" type="text" class="form-control-academic" placeholder="Seu nome completo">
    </div>

    <div class="field-group">
      <input id="email" type="email" class="form-control-academic" placeholder="seu@email.com">
    </div>

    <div class="field-group">
      <input id="senha" type="password" class="form-control-academic" placeholder="••••••••">

    </div>

    <div class="field-group">
      <input id="confirmarSenha" type="password" class="form-control-academic" placeholder="••••••••">
    </div>

    
    <button id="btnCadastrar" class="btn-cadastrar">Cadastrar</button>

  </div>

  <p class="login-hint">Já tem uma conta? <a href="login.html">Faça login</a></p>

</div>
<script src="../js/navbar.js"></script>
<script src="../js/cadastro.js"></script>
</body>
</html>
