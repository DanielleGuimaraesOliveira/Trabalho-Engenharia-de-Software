
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AcademicBox</title>


        <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="../style/index.css">
        <link rel="stylesheet" href="../style/materia.css">

</head>
<body>

<div id="navbar"></div>
<div class="container py-4">

    <a href="../index.html" class="back-link mb-3 d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>

    <div id="materiaHeader" class="materia-header mb-3">
        <!-- cabeçalho da matéria será inserido aqui -->
    </div>

    <div id="listaReviews" class="review-list">
        <!-- reviews serão inseridas aqui -->
    </div>

</div>
<div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">

            <div class="modal-header border-secondary">
                <h5 class="modal-title">
                    Login necessário
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                Você precisa estar logada para publicar uma review.
            </div>

            <div class="modal-footer border-secondary">

               <a href="login.html" class="btn-entrar">
        <i class="bi bi-box-arrow-in-right"></i><span class="link-text">Entrar</span>
    </a>

                
        <a href="cadastro.html" class="btn btn-outline-light">
            Cadastrar
        </a>

            </div>

        </div>
    </div>
</div>
<script src="../js/navbar.js"></script>
<script src="../js/materia.js"></script>
</body>
</html>
