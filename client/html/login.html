
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademicBox — Login</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style/login.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar-academicbox d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-2">
    <div class="brand-mark"></div>
    <span class="brand-name">AcademicBox</span>
  </div>
  <div class="d-flex align-items-center gap-1">
    <a href="#" class="nav-link-academic">
      <i class="bi bi-house"></i><span>Home</span>
    </a>
    <a href="#" class="nav-link-academic">
      <i class="bi bi-person"></i><span>Perfil</span>
    </a>
    <a href="#" class="btn-entrar-nav ms-1">
      <i class="bi bi-box-arrow-in-right"></i> Entrar
    </a>
  </div>
</nav>

<!-- Login -->
<div class="login-wrapper">

  <h1 class="login-title">Login</h1>

  <div class="login-card">

    <div class="mb-3">
  <label class="form-label-academic">Email</label>
  <input
    id="email"
    type="email"
    class="form-control-academic"
    placeholder="seu@email.com">
</div>

<div class="mb-4">
  <label class="form-label-academic">
    Senha<span class="required-dot">*</span>
  </label>
  <input
    id="senha"
    type="password"
    class="form-control-academic"
    placeholder="••••••••">
</div>

<button id="btnLogin" class="btn-login">
  Entrar
</button>

  </div>

  <p class="register-hint">Não tem uma conta? <a href="#">Cadastre-se</a></p>

</div>

<script src="../js/login.js"></script>
</body>
</html>
