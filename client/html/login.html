
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademicBox — Login</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../style/index.css">
<link rel="stylesheet" href="../style/login.css">

</head>
<body>

<div id="navbar"></div>

<!-- Login -->
<div class="login-wrapper">

  <h1 class="login-title">Login</h1>

  <div class="login-card">

    <div class="mb-3">
  <label class="form-label-academic">Email</label>
  <input
    id="email"
    type="email"
    class="form-control-academic"
    placeholder="seu@email.com">
</div>

<div class="mb-4">
  <label class="form-label-academic">
    Senha<span class="required-dot">*</span>
  </label>
  <input
    id="senha"
    type="password"
    class="form-control-academic"
    placeholder="••••••••">
</div>

<button id="btnLogin" class="btn-login">
  Entrar
</button>

  </div>

  <p class="register-hint">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>

</div>

<script src="../js/navbar.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
